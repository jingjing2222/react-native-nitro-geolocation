appId: nitrogeolocation.example
---
# Uses only the public Modern API to prove native watch snapshots and cleanup.

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Geolocation API"
    timeout: 10000

- stopApp

- openLink:
    link: nitrogeolocation://app/watch-observability
- runFlow:
    when:
      platform: iOS
      visible: "Cancel|취소"
    commands:
      - tapOn:
          text: "Open|열기"
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink:
          link: nitrogeolocation://app/watch-observability
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Inspect active Modern API position and heading watches"
    timeout: 10000

- tapOn:
    id: "e2e-action-watch-observability-refresh-button"
- assertVisible:
    text: "Idle snapshot: passed"
- assertVisible:
    text: "Active: 0"

- tapOn:
    id: "e2e-action-watch-observability-start-button"
- tapOn:
    text: ".*(While using the app|앱 사용 중에만 허용|Allow While Using App|앱을 사용하는 동안 허용|Allow).*"
    optional: true
- extendedWaitUntil:
    visible: "Start watches: passed"
    timeout: 15000
- assertVisible:
    text: "Active: 2"
- assertVisible:
    text: "Position: 2"
- assertVisible:
    text: "Heading: 0"

- tapOn:
    id: "e2e-action-watch-observability-remove-button"
- assertVisible:
    text: "Repeated removal: passed"
- assertVisible:
    text: "Active: 1"

- tapOn:
    id: "e2e-action-watch-observability-stop-button"
- assertVisible:
    text: "Stop all: passed"
- assertVisible:
    text: "Active: 0"
