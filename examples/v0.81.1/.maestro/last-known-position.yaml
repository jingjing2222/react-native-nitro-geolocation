appId: nitrogeolocation.example
---
# Sync/async last-known APIs: prove cold/seeded module cache plus platform cache edges.

- launchApp:
    clearState: true
    permissions:
      all: allow

- runFlow:
    when:
      platform: Android
      visible: ".*isn't responding|.*응답하지 않.*"
    commands:
      - tapOn:
          text: "Wait|대기"
- extendedWaitUntil:
    visible: "Geolocation API"
    timeout: 10000

- stopApp

- openLink:
    link: nitrogeolocation://app/last-known-position?case=allowed
- runFlow:
    when:
      platform: Android
      visible: ".*isn't responding|.*응답하지 않.*"
    commands:
      - tapOn:
          text: "Wait|대기"
- runFlow:
    when:
      platform: iOS
      visible: "Cancel|취소"
    commands:
      - tapOn:
          text: "Open|열기"
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink:
          link: nitrogeolocation://app/last-known-position?case=allowed
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Synchronous module cache and asynchronous platform cache contracts"
    timeout: 10000

- setLocation:
    latitude: 37.5665
    longitude: 126.978

- tapOn:
    id: "e2e-action-last-known-position-run-cold-button"

- extendedWaitUntil:
    visible: "Cold module cache: passed"
    timeout: 10000

- assertVisible:
    id: "last-known-position-cold-result"
- assertVisible:
    text: ".*returned undefined without querying native location sources.*"

- tapOn:
    id: "e2e-action-last-known-position-run-stale-button"

- extendedWaitUntil:
    visible: "Stale cache: passed"
    timeout: 10000

- assertVisible:
    id: "last-known-position-stale-result"
- assertVisible:
    text: ".*returned undefined without starting a fresh request.*"

- tapOn:
    id: "e2e-action-last-known-position-run-system-button"

- assertVisible:
    id: "last-known-position-system-result"
- assertVisible:
    text: ".*37.566500, 126.978000.*"
- assertVisible:
    text: ".*source=platformCache.*"
- assertVisible:
    text: ".*without getCurrentPosition.*"

- tapOn:
    id: "e2e-action-last-known-position-run-cache-button"

- assertVisible:
    id: "last-known-position-cache-result"
- assertVisible:
    text: ".*37.566500, 126.978000.*"
- assertVisible:
    text: ".*sync module cache.*timestamp delta.*cache read.*ms.*"

- stopApp

- launchApp:
    permissions:
      all: deny

- runFlow:
    when:
      platform: Android
      visible: ".*isn't responding|.*응답하지 않.*"
    commands:
      - tapOn:
          text: "Wait|대기"
- extendedWaitUntil:
    visible: "Geolocation API"
    timeout: 10000

- stopApp

- openLink:
    link: nitrogeolocation://app/last-known-position?case=denied
- runFlow:
    when:
      platform: Android
      visible: ".*isn't responding|.*응답하지 않.*"
    commands:
      - tapOn:
          text: "Wait|대기"
- runFlow:
    when:
      platform: iOS
      visible: "Cancel|취소"
    commands:
      - tapOn:
          text: "Open|열기"
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink:
          link: nitrogeolocation://app/last-known-position?case=denied
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Synchronous module cache and asynchronous platform cache contracts"
    timeout: 10000

- tapOn:
    id: "e2e-action-last-known-position-run-denied-button"

- extendedWaitUntil:
    visible: "Permission denied: passed"
    timeout: 10000

- assertVisible:
    id: "last-known-position-denied-result"
- assertVisible:
    text: ".*PERMISSION_DENIED.*"
- assertVisible:
    text: ".*did not bypass native permission checks.*"
