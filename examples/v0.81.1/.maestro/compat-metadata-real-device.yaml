appId: nitrogeolocation.example
---
# Physical-device-only proof for the non-mocked compat metadata path.
# Intentionally excluded from all-tests.yaml: do not run on a simulator.

- launchApp:
    clearState: true

- stopApp

- openLink:
    link: nitrogeolocation://app/compat-metadata
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Compat Metadata Opt-in"
    timeout: 10000

- tapOn:
    id: "compat-metadata-request-permission-button"
- tapOn:
    text: "Allow While Using App|앱을 사용하는 동안 허용|OK"
    optional: true
- extendedWaitUntil:
    visible: "Granted ✅"
    timeout: 10000

- tapOn:
    id: "compat-metadata-current-button"
- extendedWaitUntil:
    visible:
      id: "compat-metadata-current-result"
    timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Response keys: coords,timestamp,mocked,provider"
      - scrollUntilVisible:
          element:
            text: "Mocked: false"
          direction: DOWN
      - assertVisible: "Mocked: false"
      - assertVisible: "Provider: (gps|network|passive|fused|unknown)"
- runFlow:
    when:
      platform: iOS
    commands:
      # CLLocation.sourceInformation is only available on iOS 15+, so `mocked`
      # is legitimately absent on older supported devices.
      - assertVisible: "Provider: unknown"
