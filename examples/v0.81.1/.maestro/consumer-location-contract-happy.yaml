appId: nitrogeolocation.example
---
# Copyable consumer contract: a granted user can request and render a real fix.

- launchApp:
    clearState: true
    permissions:
      all: allow

- runFlow:
    when:
      platform: Android
      visible: ".*isn't responding|.*응답하지 않.*"
    commands:
      - tapOn:
          text: "Wait|대기"
- extendedWaitUntil:
    visible: "Geolocation API"
    timeout: 10000

- stopApp

- openLink:
    link: nitrogeolocation://app/consumer-location-contract
- runFlow:
    when:
      platform: Android
      visible: ".*isn't responding|.*응답하지 않.*"
    commands:
      - tapOn:
          text: "Wait|대기"
- runFlow:
    when:
      platform: iOS
      visible: "Cancel|취소"
    commands:
      - tapOn:
          text: "Open|열기"
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink:
          link: nitrogeolocation://app/consumer-location-contract
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Use your location"
    timeout: 10000

- setLocation:
    latitude: 37.5665
    longitude: 126.978

- tapOn:
    id: "consumer-location-run"

- setLocation:
    latitude: 37.5665
    longitude: 126.978

- extendedWaitUntil:
    visible: "Status: passed"
    timeout: 60000

- assertVisible:
    id: "consumer-location-status"
- assertVisible: "Permission: granted"
- assertVisible: "Coordinates: 37.566500, 126.978000"
