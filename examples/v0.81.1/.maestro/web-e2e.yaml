appId: nitrogeolocation.example
---
# Web API contract through react-native-webview.
# Requires examples/web-e2e dev server on port 4173.

- launchApp:
    clearState: true
    permissions:
      all: allow

- runFlow:
    when:
      platform: Android
      visible: ".*isn't responding|.*응답하지 않.*"
    commands:
      - tapOn:
          text: "Wait|대기"
- setLocation:
    latitude: 37.5665
    longitude: 126.9780

- extendedWaitUntil:
    visible: "Geolocation API"
    timeout: 20000

- stopApp

- openLink:
    link: nitrogeolocation://app/web-e2e?autorun=success
- runFlow:
    when:
      platform: Android
      visible: ".*isn't responding|.*응답하지 않.*"
    commands:
      - tapOn:
          text: "Wait|대기"
- runFlow:
    when:
      platform: iOS
      visible: "Cancel|취소"
    commands:
      - tapOn:
          text: "Open|열기"
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink:
          link: nitrogeolocation://app/web-e2e?autorun=success
- waitForAnimationToEnd

- tapOn:
    text: "Allow"
    optional: true

- tapOn:
    text: "Allow"
    optional: true

