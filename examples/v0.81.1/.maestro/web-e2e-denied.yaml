appId: nitrogeolocation.example
---
# Keep the denied run in a separate Maestro session. Android WebView can leave
# the activity blank when app data is cleared after the long success suite.

- launchApp:
    clearState: true
    permissions:
      all: deny

- runFlow:
    when:
      platform: Android
      visible: ".*isn't responding|.*응답하지 않.*"
    commands:
      - tapOn:
          text: "Wait|대기"
- extendedWaitUntil:
    visible: "Geolocation API"
    timeout: 20000

- stopApp

- openLink:
    link: nitrogeolocation://app/web-e2e?autorun=denied
- runFlow:
    when:
      platform: Android
      visible: ".*isn't responding|.*응답하지 않.*"
    commands:
      - tapOn:
          text: "Wait|대기"
- runFlow:
    when:
      platform: iOS
      visible: "Cancel|취소"
    commands:
      - tapOn:
          text: "Open|열기"
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink:
          link: nitrogeolocation://app/web-e2e?autorun=denied
- waitForAnimationToEnd

- tapOn:
    text: "Don’t allow|Don't allow|허용 안함|허용 안 함|허용하지 않음"
    optional: true

- extendedWaitUntil:
    visible: "Nitro Geolocation Web E2E"
    timeout: 20000

- tapOn:
    text: "Don’t allow|Don't allow|허용 안함|허용 안 함|허용하지 않음"
    optional: true

- extendedWaitUntil:
    visible: "location-readiness-after-denial: pass"
    timeout: 20000
