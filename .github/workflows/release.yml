name: Release Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Create version PR or publish packages
    runs-on: ubuntu-latest
    outputs:
      geolocation-version: ${{ steps.release-tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Trust and install tools via mise
        run: |
          mise trust --yes
          mise install node

      - name: Enable Corepack
        run: |
          corepack enable
          mise reshim node

      - name: Install dependencies
        run: yarn install

      - name: Verify documentation matches the package release channel
        run: |
          yarn workspace docs build
          yarn workspace docs check:versions

      - name: Create release PR or publish packages to a safe candidate tag
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: yarn release:publish
          version-script: yarn release:version

      - name: Resolve published Geolocation version
        id: release-tag
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs['published-packages'] }}
        run: |
          version="$(
            jq -r '
              .[]
              | select(.name == "react-native-nitro-geolocation")
              | .version
            ' <<< "$PUBLISHED_PACKAGES"
          )"
          if [ -n "$version" ]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  prebuilt-binaries:
    name: Build and upload release prebuilts
    needs: release
    if: needs.release.outputs.geolocation-version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/prebuilt-binaries.yml
    with:
      tag: react-native-nitro-geolocation@${{ needs.release.outputs.geolocation-version }}
