name: docs-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/*release-version*.mjs"
      - "scripts/check-stable-docs.mjs"
      - "packages/react-native-nitro-geolocation/package.json"
      - "packages/react-native-nitro-geolocation/README.md"
      - ".github/workflows/docs-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Trust and install tools via mise
        run: |
          mise trust --yes
          mise install node

      - name: Enable Corepack
        run: |
          corepack enable
          mise reshim node

      - name: Install dependencies
        run: |
          yarn install

      - name: Build
        working-directory: docs
        run: |
          yarn build
          yarn check:versions

      - name: Rehearse the stable 2.0 documentation transition
        run: node scripts/check-stable-docs.mjs
