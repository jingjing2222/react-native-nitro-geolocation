name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Trust and install tools via mise
        run: |
          mise trust --yes
          mise install biome

      - name: Run Biome format check
        run: |
          biome ci --formatter-enabled=true --linter-enabled=false .

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Trust and install tools via mise
        run: |
          mise trust --yes
          mise install biome

      - name: Run Biome lint
        run: |
          biome ci --formatter-enabled=false --linter-enabled=true .

  ios-location-lifecycle-contract:
    name: iOS Location Lifecycle Contract
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native pause and resume forwarding
        run: |
          scripts/test-ios-location-lifecycle.sh

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Trust and install tools via mise
        run: |
          mise trust --yes
          mise install node

      - name: Enable Corepack
        run: |
          corepack enable
          mise reshim node

      - name: Install dependencies
        run: |
          yarn install

      - name: Build all packages
        run: |
          yarn build:all

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Trust and install tools via mise
        run: |
          mise trust --yes
          mise install node

      - name: Enable Corepack
        run: |
          corepack enable
          mise reshim node

      - name: Install dependencies
        run: |
          yarn install

      - name: Run TypeScript check
        run: |
          yarn typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Trust and install tools via mise
        run: |
          mise trust --yes
          mise install java node

      - name: Enable Corepack
        run: |
          corepack enable
          mise reshim node

      - name: Install dependencies
        run: |
          yarn install

      - name: Run TypeScript unit tests
        run: |
          yarn test:unit

      - name: Run Android unit tests
        run: |
          ./examples/v0.81.1/android/gradlew \
            -p examples/v0.81.1/android \
            --no-daemon \
            --console=plain \
            :react-native-nitro-geolocation:testDebugUnitTest

  guardrails:
    name: Dead Code / Package Guardrails
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Trust and install tools via mise
        run: |
          mise trust --yes
          mise install node

      - name: Enable Corepack
        run: |
          corepack enable
          mise reshim node

      - name: Install dependencies
        run: |
          yarn install

      - name: Run dead code guard
        run: |
          yarn deadcode

      - name: Run production dead code guard
        run: |
          yarn deadcode:prod

      - name: Check package contents
        run: |
          yarn pack:check

      - name: Check source line budgets
        run: |
          yarn source-lines:check
